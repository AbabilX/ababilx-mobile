org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError -Duser.language=en -Duser.country=US -Dfile.encoding=UTF-8
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# Pub-cache is on C: while the project lives on D:. Kotlin's relocatable
# incremental caches cannot relativize paths across Windows drive roots.
kotlin.incremental=false
kotlin.incremental.android=false

# Ringtone resources are looked up by name at runtime (see res/raw/keep.xml).
# Resource optimization collapses those names, so the lookup would fail in
# release and flutter_callkit_incoming would fall back to an audible ringtone
# playing over CallRinger's.
android.enableResourceOptimizations=false
