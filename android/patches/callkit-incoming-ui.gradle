// flutter_callkit_incoming 3.1.3: restyle CallkitIncomingActivity to match
// Flutter IncomingCallView (large avatar, large centered Decline/Accept).
// Pinned resource + Activity margin patch — re-check after a plugin bump.
def uiSource = new File(settingsDir, 'patches/callkit')

def patchSource(File file, String before, String after, String what) {
    def source = file.text
    if (source.contains(after)) return
    if (!source.contains(before)) {
        throw new GradleException("flutter_callkit_incoming $what patch no longer matches 3.1.3")
    }
    file.text = source.replace(before, after)
}

gradle.beforeProject { project ->
    if (project.name != 'flutter_callkit_incoming') return
    def res = new File(project.projectDir, 'src/main/res')
    def layout = new File(res, 'layout/activity_callkit_incoming.xml')
    def dimens = new File(res, 'values/dimens.xml')
    def land = new File(res, 'layout-w600dp-land/activity_callkit_incoming.xml')

    layout.text = new File(uiSource, 'activity_callkit_incoming.xml').text
    dimens.text = new File(uiSource, 'dimens.xml').text
    // Width and height steps (dimens-w360dp.xml -> values-w360dp/): the pair
    // and the avatar are sized per screen so Accept never leaves a small one.
    uiSource.listFiles().findAll { it.name ==~ /dimens-[wh]\d+dp\.xml/ }.each { step ->
        def qualifier = step.name - 'dimens-' - '.xml'
        def target = new File(res, "values-$qualifier/ababilx_incoming_dimens.xml")
        target.parentFile.mkdirs()
        target.text = step.text
    }
    // Tablets: same pair layout (phones are forced portrait by the Activity).
    if (land.exists()) {
        land.text = new File(uiSource, 'activity_callkit_incoming.xml').text
    }

    // Decline with a message: the pill + sheet drawables and the helper that
    // fills them (patches/callkit/CallkitDeclineReplies.kt).
    ['ababilx_incoming_pill.xml', 'ababilx_incoming_sheet.xml'].each { name ->
        new File(res, "drawable/$name").text = new File(uiSource, name).text
    }
    def kotlinDir = new File(project.projectDir, 'src/main/kotlin/com/hiennv/flutter_callkit_incoming')
    new File(kotlinDir, 'CallkitDeclineReplies.kt').text =
        new File(uiSource, 'CallkitDeclineReplies.kt').text

    def activity = new File(kotlinDir, 'CallkitIncomingActivity.kt')
    patchSource(activity,
        '''        val params = llAction.layoutParams as MarginLayoutParams
        params.setMargins(0, 0, 0, Utils.getNavigationBarHeight(this@CallkitIncomingActivity))
        llAction.layoutParams = params''',
        '''        val params = llAction.layoutParams as MarginLayoutParams
        // AbabilX: nav inset + lift so Decline/Accept sit like Flutter IncomingCallView.
        val lift = resources.getDimensionPixelSize(R.dimen.size_action_lift)
        params.setMargins(0, 0, 0, Utils.getNavigationBarHeight(this@CallkitIncomingActivity) + lift)
        llAction.layoutParams = params''',
        'incoming-action-lift')

    // Play Console (Android 15): Window.setStatusBarColor / setNavigationBarColor
    // are deprecated and flagged wherever they appear in the bytecode, gated or
    // not. They were only ever making the two bars transparent; the theme's
    // windowTranslucentStatus/Navigation already lays the call screen out under
    // both bars, so keep those flags and drop the colour calls. Android 15+
    // ignored the colours anyway; below it the bars show the platform's light
    // scrim over the (dark) call background instead of nothing.
    patchSource(activity,
        '''        if (Build.VERSION.SDK_INT >= Build.VERSION_CODES.LOLLIPOP) {
            setWindowFlag(
                (WindowManager.LayoutParams.FLAG_TRANSLUCENT_STATUS
                        or WindowManager.LayoutParams.FLAG_TRANSLUCENT_NAVIGATION), false
            )
            window.statusBarColor = Color.TRANSPARENT
            window.navigationBarColor = Color.TRANSPARENT
        }''',
        '''        // AbabilX: no deprecated bar-colour calls (Play, Android 15). The
        // theme's translucent bars keep the screen edge to edge.''',
        'edge-to-edge-bar-colours')

    patchSource(activity,
        '''        ivDeclineCall.setOnClickListener {
            onDeclineClick()
        }''',
        '''        ivDeclineCall.setOnClickListener {
            onDeclineClick()
        }
        // AbabilX: Message pill -> preset replies -> decline carrying the text.
        CallkitDeclineReplies.bind(
            this,
            intent.extras?.getBundle(CallkitConstants.EXTRA_CALLKIT_INCOMING_DATA),
        ) { text -> onDeclineWithMessage(text) }''',
        'decline-message-bind')

    patchSource(activity,
        '''    private fun finishDelayed() {''',
        '''    // AbabilX: the red button's decline, with the chosen reply on the event.
    private fun onDeclineWithMessage(text: String) {
        val data = CallkitDeclineReplies.withMessage(
            intent.extras?.getBundle(CallkitConstants.EXTRA_CALLKIT_INCOMING_DATA),
            text,
        )
        sendBroadcast(
            CallkitIncomingBroadcastReceiver.getIntentDecline(this@CallkitIncomingActivity, data),
        )
        finishTask()
    }

    private fun finishDelayed() {''',
        'decline-message-action')

    // Either volume key silences the ring. The tone is the app's CallRinger,
    // not the plugin's player, so the upstream VOLUME_DOWN-only branch that
    // stopped the plugin's (silent) player never quieted anything.
    patchSource(activity,
        '''        if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN) {
            val soundPlayerManager = FlutterCallkitIncomingPlugin.getInstance()?.getCallkitSoundPlayerManager()
            if (soundPlayerManager?.isPlaying == true) {
                soundPlayerManager.stop()
                return true 
            }
        }''',
        '''        // AbabilX: a volume key silences the ring, the phone dialer's gesture.
        if (keyCode == KeyEvent.KEYCODE_VOLUME_DOWN || keyCode == KeyEvent.KEYCODE_VOLUME_UP) {
            CallkitRingSilence.request()
            return true
        }''',
        'volume-key-silence')

    patchSource(activity,
        '''    override fun onBackPressed() {}''',
        '''    // AbabilX: Back closes the reply sheet; the ringing screen itself stays.
    override fun onBackPressed() {
        CallkitDeclineReplies.close(this)
    }''',
        'decline-message-back')
}
