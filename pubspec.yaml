name: ababilx
description: "AbabilX — Slack standup automation with push notifications."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1

  # Google Sign-In (mobile-native flow)
  google_sign_in: ^6.2.1

  # HTTP client
  dio: ^5.7.0

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Navigation
  go_router: ^14.3.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1

  # Local notifications (foreground FCM display + tap routing)
  flutter_local_notifications: ^21.0.0

  # UI / Fonts / Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Image caching (avatar display)
  cached_network_image: ^3.4.1

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  equatable: ^2.0.5
  freezed_annotation: ^2.4.4
  json_annotation: ^4.9.0
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.4.3
  freezed: ^2.5.7
  json_serializable: ^6.8.0

flutter:
  uses-material-design: true
