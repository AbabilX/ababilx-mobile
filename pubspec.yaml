name: ababilx
description: "AbabilX — All-in-one team collaboration platform featuring messaging, calls, CRM, Kanban boards, and local sharing."
publish_to: "none"
version: 5.0.2+12

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  firebase_auth: ^5.3.1

  # Google Sign-In (mobile-native flow)
  google_sign_in: ^6.2.1

  # HTTP client
  dio: ^5.7.0

  # SHA-256 for attachment cache keys (already resolved transitively)
  crypto: ^3.0.7

  # State management
  flutter_riverpod: ^2.5.1

  # Navigation
  go_router: ^14.3.0

  # Secure token storage
  flutter_secure_storage: ^10.3.1
  cryptography: ^2.7.0
  cryptography_flutter: ^2.3.2
  # ECDH P-256 for message E2EE. cryptography_flutter's platform ECDH is not
  # usable: its Android bridge parses d/x/y with signed BigInteger, so most
  # identities derive a shared secret the web client never produces.
  pointycastle: ^4.0.0

  # Local notifications (foreground FCM display + tap routing)
  flutter_local_notifications: ^21.0.0

  # UI / Fonts / Animations
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_animate: ^4.5.0

  # Image caching (avatar display)
  cached_network_image: ^3.4.1
  flutter_cache_manager: ^3.4.1

  # Utilities
  intl: ^0.19.0
  timeago: ^3.6.1
  equatable: ^2.0.5
  shared_preferences: ^2.5.5
  web_socket_channel: ^3.0.3
  flutter_webrtc: ^1.5.2
  # SFU client for channel group calls (DM calls stay on raw flutter_webrtc).
  livekit_client: ^2.9.0
  flutter_callkit_incoming: ^3.1.3
  image_picker: ^1.2.3
  hugeicons: ^1.1.7
  # Local chat cache (SQLite via Drift — cache-first sidebar)
  drift: ^2.34.2
  path: ^1.9.1
  path_provider: ^2.1.6
  url_launcher: ^6.3.2
  file_picker: ^10.3.8
  share_plus: ^12.0.2
  fl_chart: ^1.2.0
  permission_handler: ^12.0.3
  audioplayers: ^6.8.1
  record: ^6.1.2
  pdfx: ^2.9.2
  webview_flutter: ^4.14.1
  video_player: ^2.13.0
  emoji_picker_flutter: ^4.5.3
  flutter_slidable: ^4.0.2

  # Local share / network
  network_info_plus: ^6.0.0
  mime: ^2.0.0
  qr_flutter: ^4.1.0
  mobile_scanner: ^5.2.3
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.13
  drift_dev: ^2.34.2
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "ic_launcher"
  ios: true
  image_path: "assets/icon/icon.png"
  adaptive_icon_background: "assets/icon/icon_background.png"
  adaptive_icon_foreground: "assets/icon/icon_foreground.png"
  remove_alpha_ios: false
  min_sdk_android: 21
  web:
    generate: false
  macos:
    generate: false

flutter:
  uses-material-design: true
  assets:
    - assets/icon/icon.png
    - assets/ringtone/Clear_Agenda.mp3

# `source: system` = package:sqlite3's FFI binding does a plain dlopen of
# "libsqlite3.so" and expects the app to already carry that library, rather
# than have the hook download/compile one. Two bugs meant it never actually
# got bundled: (1) this key used to be `hook: sqlite3: source: system` — the
# wrong schema (`hook`, not `hooks: user_defines:`), so it was silently
# ignored; (2) sqlite3_flutter_libs, which used to provide the library via
# its own Gradle/CMake build, is a no-op as of 0.6.0 (see its CHANGELOG —
# "no longer does anything, migrate to sqlite3 v3"). Verified as of this
# Flutter version (3.44.8) that switching to `source: sqlite3` (the hooks/
# code-assets download path) doesn't work either — Flutter's Android build
# backend never requests code assets, so the hook's own output directory
# stays empty and no .so is ever produced for Android. So: stayed on
# `source: system`, and the actual libsqlite3.so for each Android ABI is
# vendored directly at android/app/src/main/jniLibs/<abi>/libsqlite3.so
# (Gradle bundles that into the APK automatically, no plugin required) —
# see the comment in that directory for provenance/how to update it.
hooks:
  user_defines:
    sqlite3:
      source: system
